name: One-time full-project Black formatting

on:
  push:
    branches:
      - feature/2.1.0-architecture-quality-gates

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/2.1.0-architecture-quality-gates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install black==25.9.0
      - name: Format the complete project and remove this temporary workflow
        run: |
          python -m black pylex tests
          rm .github/workflows/one-time-black-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pylex tests .github/workflows/one-time-black-format.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git commit -m "style: format full project with Black"
          git push origin HEAD:feature/2.1.0-architecture-quality-gates
