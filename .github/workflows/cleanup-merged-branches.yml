name: One-time merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches whose pull requests were merged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "docs/1.10.0-complete-project-guide"
            "docs/2.0.1-release-documentation"
            "docs/2.0.2-release-alignment"
            "feature/1.1.0-core"
            "feature/1.1.1-error-reporting"
            "feature/1.2.0"
            "feature/1.3.0-architecture"
            "feature/1.4.0-interpreter-environments"
            "feature/1.5.0-smart-editor"
            "feature/1.6.0-advanced-debugger"
            "feature/1.7.0-integrated-terminal"
            "feature/1.8.0-quality-tooling"
            "feature/1.9.0-git-integration"
            "feature/1.10.0-final-quality"
            "feature/2.0.0-modern-ui-foundation"
            "feature/2.1.0-architecture-quality-gates"
            "feature/2.2.0-modular-application-architecture"
            "fix/2.0.2-execution-terminal-debugger"
          )
          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done
