name: One-time Black formatting for 2.2.0

on:
  push:
    branches:
      - feature/2.2.0-modular-application-architecture

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/2.2.0-modular-application-architecture
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install black
      - run: python -m black pylex tests
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pylex tests
          if ! git diff --cached --quiet; then
            git commit -m "style(2.2.0): format controller architecture"
            git push origin HEAD:feature/2.2.0-modular-application-architecture
          fi
