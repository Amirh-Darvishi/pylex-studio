name: Python tests

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q pylex main.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q
      - name: Black formatting check
        if: ${{ matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest' }}
        run: python -m black --check pylex/quality.py tests/test_quality.py pylex/ui/theme.py tests/test_theme.py pylex/preferences.py tests/test_preferences.py
      - name: Ruff lint check
        if: ${{ matrix.python-version == '3.11' }}
        run: python -m ruff check pylex/quality.py pylex/git.py pylex/git_panel.py tests/test_quality.py tests/test_git.py pylex/ui/theme.py tests/test_theme.py pylex/preferences.py tests/test_preferences.py
